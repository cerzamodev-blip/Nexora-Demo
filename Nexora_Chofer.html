<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Nexora Chofer">
<meta name="theme-color" content="#FFFFFF">
<title>Nexora Chofer</title>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;600;700&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.7/dist/umd/supabase.min.js"></script>
<style>
:root{
  --bg:#F0F4F8;--card:#FFFFFF;--card2:#F8FAFC;
  --ice:#0EA5E9;--ice-d:#0284C7;--ice-l:rgba(14,165,233,.1);
  --green:#16A34A;--green-l:rgba(22,163,74,.1);--green-d:#15803D;
  --red:#DC2626;--red-l:rgba(220,38,38,.1);
  --warn:#D97706;--warn-l:rgba(217,119,6,.1);
  --text:#0F172A;--text2:#475569;--text3:#94A3B8;
  --border:#E2E8F0;--r:14px;
  --sh:0 1px 3px rgba(15,23,42,.08),0 4px 12px rgba(15,23,42,.06);
}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overscroll-behavior:none;-webkit-font-smoothing:antialiased}
::-webkit-scrollbar{width:0}
#loader{position:fixed;inset:0;background:var(--bg);display:flex;align-items:center;justify-content:center;z-index:9999;flex-direction:column;gap:14px}
.spin{width:40px;height:40px;border:3px solid var(--border);border-top-color:var(--ice);border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}

/* LOGIN */
#login{position:fixed;inset:0;background:linear-gradient(160deg,#0F172A 0%,#1E3A5F 60%,#0C4A6E 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px;z-index:999}
.login-logo{width:72px;height:72px;background:linear-gradient(135deg,var(--ice),var(--ice-d));border-radius:20px;display:flex;align-items:center;justify-content:center;font-size:34px;margin-bottom:20px;box-shadow:0 0 40px rgba(14,165,233,.4)}
.login-title{font-size:28px;font-weight:700;margin-bottom:6px;letter-spacing:-.02em;color:#FFFFFF}
.login-sub{font-size:14px;color:rgba(255,255,255,.6);margin-bottom:36px}
.login-card{background:#FFFFFF;border-radius:20px;padding:24px;width:100%;max-width:340px;box-shadow:0 20px 60px rgba(0,0,0,.3)}
.lbl{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.08em;color:var(--text2);margin-bottom:6px}
.fi{width:100%;height:48px;background:var(--bg);border:1.5px solid var(--border);border-radius:10px;padding:0 14px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:15px;outline:none;transition:border .15s;margin-bottom:14px}
.fi:focus{border-color:var(--ice);box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.fi::placeholder{color:var(--text3)}
.btn-login{width:100%;height:50px;background:linear-gradient(135deg,var(--ice),var(--ice-d));border:none;border-radius:12px;color:#FFFFFF;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s;letter-spacing:.01em}
.btn-login:active{opacity:.85;transform:scale(.98)}
.login-err{color:var(--red);font-size:13px;text-align:center;margin-top:10px;display:none}

/* APP */
#app{display:none;height:100dvh;flex-direction:column;overflow:hidden;background:var(--bg)}
#app.on{display:flex}

/* TOPBAR */
.topbar{background:#FFFFFF;border-bottom:1px solid var(--border);padding:10px 14px;display:flex;align-items:center;gap:10px;flex-shrink:0;padding-top:max(10px,env(safe-area-inset-top));box-shadow:0 1px 4px rgba(15,23,42,.06)}
.tb-av{width:36px;height:36px;border-radius:50%;background:linear-gradient(135deg,var(--ice),var(--ice-d));display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700;color:#FFFFFF;flex-shrink:0}
.tb-info{flex:1;min-width:0}
.tb-nm{font-size:14px;font-weight:700;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:var(--text)}
.tb-ruta{font-size:11px;color:var(--text3);margin-top:1px}
.gps-pill{display:flex;align-items:center;gap:5px;border-radius:20px;padding:5px 12px;font-size:11px;font-weight:700;cursor:default;border:1.5px solid;flex-shrink:0}
.gps-pill.on{background:rgba(22,163,74,.1);border-color:rgba(22,163,74,.3);color:var(--green-d)}
.gps-pill.off{background:var(--warn-l);border-color:rgba(217,119,6,.3);color:var(--warn)}
.gps-dot{width:7px;height:7px;border-radius:50%;background:currentColor}
.gps-pill.on .gps-dot{animation:gpsp 1.4s infinite}
@keyframes gpsp{0%,100%{opacity:1}50%{opacity:.3}}
.tb-logout{width:32px;height:32px;border:1.5px solid var(--border);border-radius:9px;background:var(--bg);color:var(--text2);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}

/* CONTENT */
.content{flex:1;overflow-y:auto;padding:14px;-webkit-overflow-scrolling:touch;padding-bottom:max(20px,env(safe-area-inset-bottom))}

/* STATS */
.stats-bar{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin-bottom:14px}
.stat-box{background:#FFFFFF;border-radius:12px;border:1px solid var(--border);padding:12px 8px;text-align:center;box-shadow:var(--sh)}
.sv{font-family:'DM Mono',monospace;font-size:20px;font-weight:600;line-height:1;color:var(--text)}
.sl{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--text3);margin-top:4px}

/* ENTREGA CARD */
.ec{background:#FFFFFF;border-radius:var(--r);border:1.5px solid var(--border);margin-bottom:12px;overflow:hidden;box-shadow:var(--sh);transition:box-shadow .2s}
.ec[data-est="en_camino"]{border-color:rgba(14,165,233,.4);box-shadow:0 2px 12px rgba(14,165,233,.12)}
.ec[data-est="entregado"]{border-color:rgba(22,163,74,.3);opacity:.85}
.ec[data-est="fallido"]{border-color:rgba(220,38,38,.3);opacity:.8}
.ec-stripe{height:4px}
.ec-stripe[data-est="pendiente"]{background:linear-gradient(90deg,var(--warn),#F59E0B)}
.ec-stripe[data-est="en_camino"]{background:linear-gradient(90deg,var(--ice),var(--ice-d));animation:sh 1.8s ease-in-out infinite}
.ec-stripe[data-est="entregado"]{background:linear-gradient(90deg,var(--green),#22C55E)}
.ec-stripe[data-est="fallido"]{background:linear-gradient(90deg,var(--red),#EF4444)}
@keyframes sh{0%,100%{opacity:1}50%{opacity:.5}}
.ec-body{padding:16px}
.ec-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:12px}
.ec-num{width:40px;height:40px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-family:'DM Mono',monospace;font-size:14px;font-weight:600;flex-shrink:0}
.ec-num[data-est="pendiente"]{background:var(--warn-l);color:var(--warn)}
.ec-num[data-est="en_camino"]{background:var(--ice-l);color:var(--ice-d)}
.ec-num[data-est="entregado"]{background:var(--green-l);color:var(--green-d)}
.ec-num[data-est="fallido"]{background:var(--red-l);color:var(--red)}
.ec-nm{font-size:16px;font-weight:700;line-height:1.2;color:var(--text)}
.ec-dir{font-size:13px;color:var(--text2);margin-top:4px;font-weight:500}
.ec-nota{font-size:12px;color:var(--text3);margin-top:3px;font-style:italic}
.ec-badge{margin-left:auto;flex-shrink:0;padding:4px 12px;border-radius:20px;font-size:10px;font-weight:700;text-transform:uppercase;white-space:nowrap;letter-spacing:.04em}
.ec-badge[data-est="pendiente"]{background:var(--warn-l);color:var(--warn)}
.ec-badge[data-est="en_camino"]{background:var(--ice-l);color:var(--ice-d)}
.ec-badge[data-est="entregado"]{background:var(--green-l);color:var(--green-d)}
.ec-badge[data-est="fallido"]{background:var(--red-l);color:var(--red)}
.ec-monto{display:flex;justify-content:space-between;align-items:center;background:var(--bg);border-radius:10px;padding:10px 14px;margin-bottom:12px;border:1px solid var(--border)}
.ec-ml{font-size:11px;color:var(--text3);font-weight:600;text-transform:uppercase;letter-spacing:.04em}
.ec-mv{font-family:'DM Mono',monospace;font-size:16px;font-weight:700;color:var(--text)}
.ec-prods{font-size:12px;color:var(--text2);padding:0 0 10px;margin-bottom:10px;border-bottom:1px solid var(--border);font-weight:500}

/* ACTION BUTTONS */
.ec-acts{display:grid;gap:8px;grid-template-columns:1fr 1fr}
.eb{height:50px;border-radius:12px;border:2px solid;font-family:'DM Sans',sans-serif;font-size:13px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s;-webkit-tap-highlight-color:transparent;letter-spacing:.01em}
.eb:active{transform:scale(.96)}
.eb.maps{border-color:rgba(14,165,233,.3);color:var(--ice-d);background:var(--ice-l)}
.eb.salir{border-color:rgba(14,165,233,.4);color:var(--ice-d);background:var(--ice-l)}
.eb.regresar{border-color:var(--border);color:var(--text2);background:var(--bg)}
.eb.cobrar{border-color:rgba(217,119,6,.4);color:var(--warn);background:var(--warn-l)}
.eb.entregar{border-color:rgba(22,163,74,.4);color:var(--green-d);background:var(--green-l)}
.eb.fallido{border-color:rgba(220,38,38,.3);color:var(--red);background:var(--red-l)}
.eb.deshacer{border-color:var(--border);color:var(--text2);background:var(--bg)}
.eb.full{grid-column:1/-1}

/* MODAL */
.overlay{display:none;position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:500;align-items:flex-end;justify-content:center;backdrop-filter:blur(8px)}
.overlay.on{display:flex;animation:fi .18s}
@keyframes fi{from{opacity:0}to{opacity:1}}
.modal{background:#FFFFFF;border-radius:20px 20px 0 0;padding:24px 20px;width:100%;max-height:85vh;overflow-y:auto;animation:su .22s ease;border-top:1px solid var(--border);padding-bottom:max(24px,env(safe-area-inset-bottom));box-shadow:0 -8px 40px rgba(15,23,42,.15)}
@keyframes su{from{transform:translateY(100%)}to{transform:translateY(0)}}
.mt{font-size:18px;font-weight:700;margin-bottom:16px;padding-bottom:14px;border-bottom:1px solid var(--border);color:var(--text)}
.mf{display:flex;gap:8px;margin-top:16px;padding-top:14px;border-top:1px solid var(--border)}
.mfi{width:100%;height:56px;background:var(--bg);border:2px solid var(--border);border-radius:12px;padding:0 14px;color:var(--text);font-family:'DM Mono',monospace;font-size:24px;text-align:center;outline:none;margin-bottom:12px;transition:border .15s;font-weight:600}
.mfi:focus{border-color:var(--ice);box-shadow:0 0 0 3px rgba(14,165,233,.15)}
.mbtn{flex:1;height:52px;border-radius:12px;border:none;font-family:'DM Sans',sans-serif;font-size:15px;font-weight:700;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:6px;transition:all .15s}
.mbtn:active{opacity:.8;transform:scale(.97)}
.mbtn.cancel{background:var(--bg);color:var(--text2);border:1.5px solid var(--border)}
.mbtn.confirm{background:linear-gradient(135deg,var(--green),#22C55E);color:#FFFFFF}
.met-btn{flex:1;height:46px;border-radius:10px;border:2px solid var(--border);background:var(--bg);color:var(--text2);font-family:'DM Sans',sans-serif;font-size:12px;font-weight:700;cursor:pointer;transition:all .15s}
.met-btn:active{transform:scale(.97)}

/* EMPTY */
.empty{text-align:center;padding:56px 20px;color:var(--text3)}

/* TOAST */
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--text);color:#FFFFFF;padding:12px 22px;border-radius:12px;font-size:13px;font-weight:600;z-index:999;transition:transform .3s;pointer-events:none;white-space:nowrap;box-shadow:0 8px 32px rgba(15,23,42,.25)}
.toast.on{transform:translateX(-50%) translateY(0)}
.toast.ok{background:var(--green-d)}
.toast.err{background:var(--red)}
</style>
</head>
<body>

<div id="loader"><div class="spin"></div><div style="font-size:13px;color:var(--text2)">Cargando...</div></div>

<!-- LOGIN -->
<div id="login" style="display:none">
  <div class="login-logo">🧊</div>
  <div class="login-title">Nexora Chofer</div>
  <div class="login-sub">App de entregas</div>
  <div class="login-card">
    <div class="lbl">PIN de acceso</div>
    <input type="password" inputmode="numeric" maxlength="6" class="fi" id="l-pin" placeholder="••••"
      style="letter-spacing:6px;text-align:center;font-size:24px" onkeydown="if(event.key==='Enter')login()">
    <div class="lbl">Tu nombre</div>
    <input type="text" class="fi" id="l-nombre" placeholder="Como apareces en el sistema"
      onkeydown="if(event.key==='Enter')login()">
    <button class="btn-login" onclick="login()">Ingresar →</button>
    <div class="login-err" id="l-err">PIN incorrecto</div>
  </div>
</div>

<!-- APP -->
<div id="app">
  <div class="topbar">
    <div class="tb-av" id="av">CH</div>
    <div class="tb-info">
      <div class="tb-nm" id="tb-nm">Chofer</div>
      <div class="tb-ruta" id="tb-ruta">Cargando...</div>
    </div>
    <div class="gps-pill off" id="gps-pill">
      <div class="gps-dot"></div>
      <span id="gps-lbl">GPS</span>
    </div>
    <button class="tb-logout" onclick="salir()" title="Cerrar sesión">🚪</button>
  </div>

  <div class="content">
    <div class="stats-bar">
      <div class="stat-box"><div class="sv" id="s-tot">0</div><div class="sl">Total</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--green)" id="s-ent">0</div><div class="sl">Entregadas</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--ice)" id="s-cam">0</div><div class="sl">En camino</div></div>
      <div class="stat-box"><div class="sv" style="color:var(--warn)" id="s-pen">0</div><div class="sl">Pendientes</div></div>
    </div>
    <div id="lista"></div>
  </div>
</div>

<!-- MODAL COBRO -->
<div class="overlay" id="m-cobro">
  <div class="modal">
    <div class="mt">💵 Registrar cobro</div>
    <input type="hidden" id="cob-id">
    <div style="background:rgba(255,255,255,.04);border-radius:10px;padding:12px;margin-bottom:14px;font-size:13px;color:var(--text2)" id="cob-info"></div>
    <div style="font-size:11px;font-weight:600;text-transform:uppercase;letter-spacing:.08em;color:var(--text3);margin-bottom:8px">Monto</div>
    <input type="number" inputmode="decimal" class="mfi" id="cob-monto" placeholder="0.00" min="0" step="0.01">
    <div style="display:flex;gap:8px;margin-bottom:4px">
      <button class="met-btn" data-m="Efectivo" onclick="selM(this)">💵 Efectivo</button>
      <button class="met-btn" data-m="Transferencia" onclick="selM(this)">🏦 Transfer.</button>
      <button class="met-btn" data-m="Cheque" onclick="selM(this)">📋 Cheque</button>
    </div>
    <div class="mf">
      <button class="mbtn cancel" onclick="cM('m-cobro')">Cancelar</button>
      <button class="mbtn confirm" onclick="guardarCobro()">✓ Registrar</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
'use strict';

const SB_URL='https://upyqqhbzzjsblvwrwixw.supabase.co';
const SB_KEY='eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVweXFxaGJ6empzYmx2d3J3aXh3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzY1MzE1MTEsImV4cCI6MjA5MjEwNzUxMX0.ZKKvM5U0aNkqhijkgZSbjMdJZFNo3u_Zu3jo58ye4ic';

let _sb=null;
function getSB(){
  if(_sb)return _sb;
  if(!window.supabase?.createClient)return null;
  _sb=window.supabase.createClient(SB_URL,SB_KEY,{
    auth:{persistSession:false,autoRefreshToken:false,detectSessionInUrl:false},
    realtime:{params:{eventsPerSecond:2}},
    global:{fetch:(u,o={})=>new Promise((rs,rj)=>{
      const x=new XMLHttpRequest();x.open(o.method||'GET',u,true);
      const h=o.headers||{};const ph=h instanceof Headers?Object.fromEntries(h.entries()):h;
      Object.entries(ph).forEach(([k,v])=>x.setRequestHeader(k,v));
      x.responseType='text';
      x.onload=()=>{const rh=new Headers();x.getAllResponseHeaders().trim().split('\r\n').forEach(l=>{const i=l.indexOf(':');if(i>0)rh.append(l.slice(0,i).trim(),l.slice(i+1).trim())});rs(new Response(x.responseText,{status:x.status,headers:rh}))};
      x.onerror=()=>rj(new TypeError('Network failed'));x.send(o.body??null);
    })}
  });
  return _sb;
}

const ld=(k,d)=>{try{const v=localStorage.getItem('nx_ch_'+k);return v?JSON.parse(v):d}catch{return d}};
const sv=(k,v)=>{try{localStorage.setItem('nx_ch_'+k,JSON.stringify(v))}catch{}};

let chofer=null,ruta=null,pedidos=[],cobros=[],gpsOn=false,gpsWatch=null,metodo='Efectivo';
const sym=()=>localStorage.getItem('nx_simbolo')||'RD$';
const fmt=n=>sym()+' '+Number(n||0).toLocaleString('es',{minimumFractionDigits:2,maximumFractionDigits:2});

// ── LOGIN ──
async function login(){
  const pin=document.getElementById('l-pin').value;
  const nombre=document.getElementById('l-nombre').value.trim();
  if(!pin||!nombre){err('Ingresa nombre y PIN');return;}
  const sb=getSB();
  let u=null;
  if(sb){const {data}=await sb.from('usuarios').select('*').eq('pin',pin).maybeSingle();if(data)u=data;}
  if(!u)u=ld('usuarios',[]).find(x=>x.pin===pin);
  if(!u){err('PIN incorrecto');return;}
  chofer={...u,nombre};sv('session',chofer);arrancar();
}
function err(m){const e=document.getElementById('l-err');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',3000);}

// ── APP ──
async function arrancar(){
  document.getElementById('login').style.display='none';
  document.getElementById('app').classList.add('on');
  document.getElementById('av').textContent=chofer.nombre.substring(0,2).toUpperCase();
  document.getElementById('tb-nm').textContent=chofer.nombre;
  await cargar();
  render();
  realtime();
  startGPS(); // GPS siempre activo
}

async function cargar(){
  const sb=getSB();
  const hoy=new Date().toISOString().split('T')[0];
  if(sb){
    const [{data:p},{data:r},{data:c}]=await Promise.all([
      sb.from('pedidos').select('*').eq('fecha',hoy),
      sb.from('rutas').select('*'),
      sb.from('cobros').select('*').eq('fecha',hoy)
    ]);
    ruta=(r||[]).find(x=>x.chofer===chofer.nombre)||null;
    // Load pedidos assigned directly to chofer OR via their ruta
    pedidos=(p||[]).filter(x=>
      x.chofer_id===chofer.id ||
      x.chofer_nm===chofer.nombre ||
      (ruta && x.ruta_id===ruta.id)
    );
    // If no pedidos found via any method, show all for today
    if(!pedidos.length) pedidos=(p||[]);
    cobros=(c||[]).filter(x=>x.chofer_nm===chofer.nombre||x.chofer_id===chofer.id);
    document.getElementById('tb-ruta').textContent=ruta?`🚚 ${ruta.nombre} · ${hoy}`:`📅 ${hoy}`;
    sv('pedidos',pedidos);sv('cobros',cobros);
  }else{
    pedidos=ld('pedidos',[]);cobros=ld('cobros',[]);
    document.getElementById('tb-ruta').textContent='Sin conexión';
  }
}

// ── REALTIME ──
function realtime(){
  const sb=getSB();if(!sb)return;
  const hoy=new Date().toISOString().split('T')[0];
  sb.channel('ch-live')
    .on('postgres_changes',{event:'INSERT',schema:'public',table:'pedidos'},async pl=>{
      if(!pl.new) return;
      // Only add if it's for today and assigned to this chofer
      const esMio = pl.new.chofer_id===chofer?.id ||
                    pl.new.chofer_nm===chofer?.nombre ||
                    (ruta && pl.new.ruta_id===ruta.id);
      const esHoy = pl.new.fecha===hoy;
      if(esMio && esHoy){
        pedidos.push(pl.new);
        sv('pedidos',pedidos);
        render();
        toast('📦 Nuevo pedido asignado','ok');
      }
    })
    .on('postgres_changes',{event:'UPDATE',schema:'public',table:'pedidos'},pl=>{
      if(!pl.new) return;
      const i=pedidos.findIndex(p=>p.id===pl.new.id);
      if(i>=0){
        pedidos[i]={...pedidos[i],...pl.new};
        sv('pedidos',pedidos);
        render();
      } else {
        // Might be a new pedido assigned to us
        const esMio = pl.new.chofer_id===chofer?.id ||
                      pl.new.chofer_nm===chofer?.nombre ||
                      (ruta && pl.new.ruta_id===ruta.id);
        const esHoy = pl.new.fecha===hoy;
        if(esMio && esHoy){
          pedidos.push(pl.new);
          sv('pedidos',pedidos);
          render();
          toast('📦 Pedido asignado','ok');
        }
      }
    })
    .on('postgres_changes',{event:'DELETE',schema:'public',table:'pedidos'},pl=>{
      if(!pl.old) return;
      const i=pedidos.findIndex(p=>p.id===pl.old.id);
      if(i>=0){pedidos.splice(i,1);sv('pedidos',pedidos);render();}
    })
    .subscribe(status=>{
      if(status==='SUBSCRIBED') console.log('Realtime conectado');
    });

  // También auto-recargar cada 30s como respaldo
  setInterval(async()=>{
    await cargar();
    render();
  }, 30000);
}

// ── RENDER ──
function render(){
  const done=pedidos.filter(p=>p.estado==='entregado').length;
  const cam=pedidos.filter(p=>p.estado==='en_camino').length;
  const pen=pedidos.filter(p=>!p.estado||p.estado==='pendiente').length;
  document.getElementById('s-tot').textContent=pedidos.length;
  document.getElementById('s-ent').textContent=done;
  document.getElementById('s-cam').textContent=cam;
  document.getElementById('s-pen').textContent=pen;

  const el=document.getElementById('lista');
  if(!pedidos.length){
    el.innerHTML=`<div class="empty"><div style="font-size:48px;margin-bottom:12px">📦</div><div style="font-size:15px;font-weight:600;color:var(--text2);margin-bottom:5px">Sin pedidos para hoy</div><div style="font-size:13px">El administrador asignará los pedidos</div></div>`;
    return;
  }
  const ORD={pendiente:0,en_camino:1,entregado:2,fallido:3};
  el.innerHTML=[...pedidos].sort((a,b)=>(ORD[a.estado||'pendiente']||0)-(ORD[b.estado||'pendiente']||0)).map((p,i)=>{
    const est=p.estado||'pendiente';
    const cobP=cobros.filter(c=>c.pedido_id===p.id).reduce((s,c)=>s+(c.monto||0),0);
    const saldo=Math.max(0,(p.total||0)-cobP);
    const labels={pendiente:'⏳ Pendiente',en_camino:'🚚 En camino',entregado:'✅ Entregado',fallido:'❌ Fallido'};
    const done=est==='entregado'||est==='fallido';
    const prods=(p.items||[]).map(it=>`${it.nombre||'—'} ×${it.cant}`).join(' · ');
    return `<div class="ec" data-est="${est}">
      <div class="ec-stripe" data-est="${est}"></div>
      <div class="ec-body">
        <div class="ec-head">
          <div class="ec-num" data-est="${est}">#${i+1}</div>
          <div style="flex:1;min-width:0">
            <div class="ec-nm">${p.cliente_nm||'—'}</div>
            ${p.cliente_dir?`<div class="ec-dir">📍 ${p.cliente_dir}</div>`:''}
            ${p.notas?`<div class="ec-nota">💬 ${p.notas}</div>`:''}
          </div>
          <span class="ec-badge" data-est="${est}">${labels[est]||est}</span>
        </div>
        <div class="ec-monto">
          <div><div class="ec-ml">${p.modalidad==='credito'?'🏦 Crédito':'💵 Contado'}</div><div class="ec-mv">${fmt(p.total||0)}</div></div>
          ${cobP>0?`<div style="text-align:right"><div class="ec-ml">${saldo>0?'Saldo pendiente':'Cobrado ✓'}</div><div class="ec-mv" style="color:${saldo>0?'var(--warn)':'var(--green)'}">${fmt(saldo>0?saldo:cobP)}</div></div>`:''}
        </div>
        ${prods?`<div class="ec-prods">${prods}</div>`:''}
        <div class="ec-acts${done?' full':''}">
          ${!done?`
            ${p.cliente_dir?`<button class="eb maps" onclick="verMaps('${encodeURIComponent(p.cliente_dir||p.cliente_nm||'')}')">🗺️ Maps</button>`:'<div></div>'}
            ${est==='pendiente'?`<button class="eb salir" onclick="cambiar('${p.id}','en_camino')">🚚 Salir a entregar</button>`:`<button class="eb regresar" onclick="cambiar('${p.id}','pendiente')">↩ Regresar</button>`}
            ${p.modalidad!=='credito'?`<button class="eb cobrar" onclick="abrirCobro('${p.id}')">💵 Cobrar</button>`:'<div></div>'}
            <button class="eb entregar full" onclick="cambiar('${p.id}','entregado')">✅ Marcar como entregado</button>
            <button class="eb fallido" onclick="cambiar('${p.id}','fallido')">❌ No entregado / Fallido</button>
          `:`<button class="eb deshacer full" onclick="cambiar('${p.id}','pendiente')">↩ Deshacer — volver a pendiente</button>`}
        </div>
      </div>
    </div>`;
  }).join('');
}

// ── CAMBIAR ESTADO ──
async function cambiar(id,est){
  const i=pedidos.findIndex(p=>p.id===id);if(i<0)return;
  pedidos[i].estado=est;
  sv('pedidos',pedidos);
  render();
  const sb=getSB();
  if(sb)await sb.from('pedidos').update({estado:est,updated_at:new Date().toISOString()}).eq('id',id);
  const L={pendiente:'⏳ Pendiente',en_camino:'🚚 En camino',entregado:'✅ Entregado',fallido:'❌ Fallido'};
  toast(L[est]||est,'ok');
}

// ── MAPS ──
function verMaps(dir){window.open(`https://www.google.com/maps/search/?api=1&query=${dir}`,'_blank');}

// ── COBRO ──
function abrirCobro(id){
  const p=pedidos.find(x=>x.id===id);if(!p)return;
  const cobP=cobros.filter(c=>c.pedido_id===id).reduce((s,c)=>s+(c.monto||0),0);
  const saldo=Math.max(0,(p.total||0)-cobP);
  document.getElementById('cob-id').value=id;
  document.getElementById('cob-monto').value=saldo.toFixed(2);
  document.getElementById('cob-info').innerHTML=`<strong>${p.cliente_nm}</strong><br>Total: ${fmt(p.total||0)} · Cobrado: ${fmt(cobP)}${saldo>0?` · <strong style="color:var(--warn)">Saldo: ${fmt(saldo)}</strong>`:''}`;
  metodo='Efectivo';
  document.querySelectorAll('.met-btn').forEach(b=>{const on=b.dataset.m==='Efectivo';b.style.background=on?'var(--ice-l)':'transparent';b.style.borderColor=on?'rgba(56,189,248,.4)':'var(--border)';b.style.color=on?'var(--ice)':'var(--text2)';});
  oM('m-cobro');
}

function selM(btn){
  metodo=btn.dataset.m;
  document.querySelectorAll('.met-btn').forEach(b=>{const on=b===btn;b.style.background=on?'var(--ice-l)':'transparent';b.style.borderColor=on?'rgba(56,189,248,.4)':'var(--border)';b.style.color=on?'var(--ice)':'var(--text2)';});
}

async function guardarCobro(){
  const id=document.getElementById('cob-id').value;
  const monto=parseFloat(document.getElementById('cob-monto').value)||0;
  if(!monto||monto<=0){toast('Ingresa un monto válido','err');return;}
  const p=pedidos.find(x=>x.id===id);if(!p)return;
  const hoy=new Date().toISOString().split('T')[0];
  const c={id:String(Date.now()),pedido_id:id,factura_id:id,factura_num:'',cliente_id:p.cliente_id||'',cliente_nm:p.cliente_nm||'',monto,metodo,ref:'',fecha:hoy,notas:`Cobrado por ${chofer.nombre}`,chofer_id:chofer.id||'',chofer_nm:chofer.nombre||''};
  cobros.push(c);sv('cobros',cobros);
  const sb=getSB();
  if(sb)await sb.from('cobros').upsert({...c,created_at:new Date().toISOString(),updated_at:new Date().toISOString()},{onConflict:'id'});
  cM('m-cobro');render();toast(`✓ ${fmt(monto)} registrado`,'ok');
}

// ── GPS ──
function startGPS(){
  if(!navigator.geolocation){toast('GPS no disponible','err');return;}
  gpsWatch=navigator.geolocation.watchPosition(async pos=>{
    gpsOn=true;updateGPS(true);
    const sb=getSB();
    if(sb&&chofer)await sb.from('gps_tracks').upsert({id:chofer.id||String(Date.now()),chofer_id:chofer.id||'',chofer_nm:chofer.nombre||'',lat:pos.coords.latitude,lng:pos.coords.longitude,updated_at:new Date().toISOString()},{onConflict:'id'});
  },e=>{toast('GPS: '+e.message,'err');stopGPS();},{enableHighAccuracy:true,timeout:10000,maximumAge:5000});
}
function stopGPS(){if(gpsWatch)navigator.geolocation.clearWatch(gpsWatch);gpsWatch=null;gpsOn=false;updateGPS(false);}
function updateGPS(on){const p=document.getElementById('gps-pill');const l=document.getElementById('gps-lbl');p.className='gps-pill '+(on?'on':'off');l.textContent=on?'📍 GPS activo':'⏳ GPS...';}

// ── UTILS ──
function oM(id){document.getElementById(id).classList.add('on');}
function cM(id){document.getElementById(id).classList.remove('on');}
document.addEventListener('click',e=>{if(e.target.classList.contains('overlay'))e.target.classList.remove('on');});
function toast(m,t=''){const el=document.getElementById('toast');el.textContent=m;el.className='toast '+(t||'');el.classList.add('on');clearTimeout(el._t);el._t=setTimeout(()=>el.classList.remove('on'),3000);}
function salir(){if(!confirm('¿Cerrar sesión?'))return;stopGPS();chofer=null;sv('session',null);document.getElementById('app').classList.remove('on');document.getElementById('login').style.display='flex';document.getElementById('l-pin').value='';document.getElementById('l-nombre').value='';}
function toggleGPS(){toast('GPS siempre activo mientras estás en ruta','');}

// ── INIT ──
async function init(){
  const s=ld('session',null);
  document.getElementById('loader').style.display='none';
  if(s){chofer=s;await arrancar();}
  else document.getElementById('login').style.display='flex';
}
init();
</script>
</body>
